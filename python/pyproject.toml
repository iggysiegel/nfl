[project]
name = "nfl"
version = "1.0.0"
description = "Glickman-Stern state-space model for NFL score margins with an external QB covariate"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
