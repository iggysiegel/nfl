name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: python/environment.yml
          activate-environment: nfl

      - name: Python lint
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: web
    env:
      PREDICTIONS_DIR: ${{ github.workspace }}/data/predictions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: npm ci

      - name: Web lint
        run: npm run lint

      - name: Web tests
        run: npm run test

      - name: Web build
        run: npm run build
